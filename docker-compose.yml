services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - db-net

  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - web-net
      - db-net

  web:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - web-net

volumes:
  db-data:

networks:
  web-net:
  db-net:
